<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Lern-App"><meta name="theme-color" content="#F3F1EA"><meta name="robots" content="noindex,nofollow"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><style>body{margin:0}</style></head><body><title>Guidos Lern-App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lern-App">
<style>
/* Layout: iPhone-App nach Apples Human Interface Guidelines. Durchscheinende Navigationsleiste, große Titel,
   gruppierte Listen (inset grouped) auf Systemhintergrund, 8-pt-Raster, SF-Systemschrift, iOS-Systemfarben. */
:root{
  --bg:#F2F2F7;--surface:#FFFFFF;--surface-2:#E9E9EF;--fill:rgba(118,118,128,.12);
  --text-primary:#000000;--text-secondary:rgba(60,60,67,.6);--text-muted:#8E8E93;--tertiary:#C4C4C7;
  --border:rgba(60,60,67,.18);--sep:rgba(60,60,67,.29);
  --accent:#007AFF;--accent-text:#007AFF;--accent-bg:#E6F0FF;
  --teal:#0071A4;--teal-bg:#E1F4F9;--amber:#C93400;--amber-bg:#FFF2E0;
  --danger:#D70015;--danger-bg:#FFE8E7;--good:#248A3D;--good-bg:#E4F6E8;
  --coral:#E8590C;--coral-bg:#FFEDE2;--violet:#5856D6;--violet-bg:#ECECFB;
  --font-head:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ink:var(--text-primary);--muted:var(--text-secondary);--line:var(--border);--accent-ink:#FFFFFF;--accent-soft:var(--accent-bg);
  --gold:var(--amber);--gold-soft:var(--amber-bg);--flame:#FF9500;--good-soft:var(--good-bg);--bad:var(--danger);--bad-soft:var(--danger-bg);
  --bar-bg:rgba(249,249,249,.78);--shadow:0 1px 2px rgba(0,0,0,.04);
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000;--surface:#1C1C1E;--surface-2:#2C2C2E;--fill:rgba(118,118,128,.24);
  --text-primary:#FFFFFF;--text-secondary:rgba(235,235,245,.6);--text-muted:#8E8E93;--tertiary:#48484A;
  --border:rgba(84,84,88,.6);--sep:rgba(84,84,88,.65);
  --accent:#0A84FF;--accent-text:#0A84FF;--accent-bg:#0A2A4D;
  --teal:#40C8E0;--teal-bg:#0E2E35;--amber:#FF9F0A;--amber-bg:#3A2A0A;
  --danger:#FF453A;--danger-bg:#3A1513;--good:#30D158;--good-bg:#0F2E18;
  --coral:#FF9F0A;--coral-bg:#3A2A0A;--violet:#5E5CE6;--violet-bg:#1E1D45;
  --bar-bg:rgba(29,29,31,.78);--shadow:none;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1C1C1E;--surface-2:#2C2C2E;--fill:rgba(118,118,128,.24);
  --text-primary:#FFFFFF;--text-secondary:rgba(235,235,245,.6);--text-muted:#8E8E93;--tertiary:#48484A;
  --border:rgba(84,84,88,.6);--sep:rgba(84,84,88,.65);
  --accent:#0A84FF;--accent-text:#0A84FF;--accent-bg:#0A2A4D;
  --teal:#40C8E0;--teal-bg:#0E2E35;--amber:#FF9F0A;--amber-bg:#3A2A0A;
  --danger:#FF453A;--danger-bg:#3A1513;--good:#30D158;--good-bg:#0F2E18;
  --coral:#FF9F0A;--coral-bg:#3A2A0A;--violet:#5E5CE6;--violet-bg:#1E1D45;
  --bar-bg:rgba(29,29,31,.78);--shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent-text)}

/* ---------- App-Rahmen ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:760px;margin:0 auto;padding:8px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.bar .back{border:0;background:none;width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.bar .back[hidden]{display:none}
.bar .back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar .ttl{font-family:var(--font-head);font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl small{display:block;font-family:var(--font-mono);font-size:.68rem;font-weight:400;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase}
.lvlchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 6px;font-family:var(--font-mono);font-size:.78rem;cursor:pointer;white-space:nowrap}
.lvlchip svg{width:24px;height:24px}
.lvlchip .fl{color:var(--flame);font-weight:600}
main#view{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 150px}
.ui{display:grid;gap:14px}
.ui h1,.ui h2,.ui h3{font-family:var(--font-head);line-height:1.15;margin:0;text-wrap:balance;font-weight:600}
.ui h1{font-size:1.9rem}.ui h2{font-size:1.3rem}.ui h3{font-size:1.06rem}
.ui p{margin:0}
.ui .muted{color:var(--muted)} .ui .small{font-size:.86rem}
.ui .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.ui .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ui .spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ui .stack{display:grid;gap:12px}
.ui .eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.ui .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ui .btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;touch-action:manipulation}
.ui .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ui .btn.ghost{background:transparent}
.ui .btn.small{padding:7px 12px;font-size:.86rem;border-radius:10px}
.ui .btn:disabled{opacity:.45;cursor:default}
.ui .btn.wide{width:100%}
.ui .linkbtn{border:0;background:none;padding:4px 0;color:var(--accent-text);cursor:pointer;font-size:.88rem;font-weight:600}
.ui .linkbtn.mutedlink{color:var(--muted);font-weight:500}
.ui .tag{display:inline-block;font-family:var(--font-mono);font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text)}
.ui .tag.gold{background:var(--gold-soft);color:var(--gold)}
.ui .bar8{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.ui .bar8 span{display:block;height:100%;background:var(--accent)}

/* ---------- Startseite ---------- */
.hero{display:grid;gap:6px;padding-top:6px}
.hero .hi{font-family:var(--font-head);font-size:2rem;font-weight:600;line-height:1.1}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.today .t{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.today .t b{display:block;font-family:var(--font-head);font-size:1.4rem;line-height:1.1}
.today .t span{font-size:.76rem;color:var(--muted)}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.subj{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 14px 12px;cursor:pointer;display:grid;gap:6px;overflow:hidden;min-width:0}
.subj::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.subj .nm{font-family:var(--font-head);font-weight:600;font-size:1.12rem;line-height:1.2}
.subj .meta{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
.subj .cd{position:absolute;right:12px;top:10px;text-align:right;font-family:var(--font-mono);line-height:1}
.subj .cd b{display:block;font-size:1.25rem;color:var(--c)}
.subj .cd small{font-size:.6rem;color:var(--muted)}
.subj.soon{background:transparent;border-style:dashed;cursor:default}
.subj.soon .nm{color:var(--muted)}
.subj .prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.subj .prog span{display:block;height:100%;background:var(--c)}

/* ---------- Fach / Kapitel ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;cursor:pointer;white-space:nowrap;scroll-snap-align:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px;background:var(--line)}
.chip .dot.half{background:var(--amber)} .chip .dot.full{background:var(--good)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-size:.84rem;font-weight:600;color:var(--muted);cursor:pointer;display:grid;justify-items:center;gap:2px}
.seg button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.khead{display:grid;gap:4px}
.khead .k{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.khead h1{font-size:1.55rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;display:grid;gap:4px;min-width:0}
.tile b{font-family:var(--font-head);font-size:1.05rem;font-weight:600}
.tile span{font-size:.84rem;color:var(--muted)}
.gamecard{position:relative;overflow:hidden;text-align:left;border:0;border-radius:18px;padding:18px 16px 16px;cursor:pointer;color:#fff;display:grid;gap:6px;min-height:150px;align-content:end;background:var(--g,#2B3A67);isolation:isolate}
.gamecard canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.55}
.gamecard .gk{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.gamecard b{font-family:var(--font-head);font-size:1.35rem;font-weight:600;line-height:1.15}
.gamecard span{font-size:.88rem;opacity:.92}
.gamecard .ms{position:absolute;top:12px;right:12px;font-family:var(--font-mono);font-size:.72rem;background:rgba(0,0,0,.25);padding:3px 8px;border-radius:999px}
.gamecard.soon{background:var(--surface-2);color:var(--muted);cursor:default;border:1px dashed var(--line)}

/* ---------- Player ---------- */
.ep{display:grid;gap:10px}
.ep .cover{aspect-ratio:16/9;max-width:100%;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--violet));position:relative;overflow:hidden;color:#fff;display:grid;align-content:end;padding:16px}
.ep .cover b{font-family:var(--font-head);font-size:1.4rem;line-height:1.15}
.ep .cover small{font-family:var(--font-mono);font-size:.72rem;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.ep .cover canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.marks{display:grid;gap:4px}
.marks button{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px;text-align:left;border:0;background:none;padding:8px 6px;border-radius:10px;cursor:pointer;font-size:.92rem}
.marks button:hover{background:var(--surface-2)}
.marks button .tm{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.marks button.now{background:var(--accent-soft)}
.mini{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.mini[hidden]{display:none}
.mini .in{max-width:760px;margin:0 auto;padding:8px 16px 10px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center}
.mini .pp{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center}
.mini .pp svg{width:20px;height:20px;fill:currentColor}
.mini .nm{font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .nm small{display:block;font-family:var(--font-mono);font-size:.7rem;font-weight:400;color:var(--muted)}
.mini .sk{border:0;background:none;cursor:pointer;font-family:var(--font-mono);font-size:.78rem;color:var(--muted);padding:6px}
.mini .prog{grid-column:1/5;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;cursor:pointer}
.mini .prog span{display:block;height:100%;background:var(--accent)}

/* ---------- Trainer ---------- */
.flash{position:relative;min-height:190px;display:grid;align-content:start;gap:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .18s ease,border-color .15s}
.flash .sentence{font-size:1.18rem;line-height:1.45}
.flash .sentence .st{color:var(--muted)} .flash .sentence .co{font-weight:600}
.flash.good{border-color:var(--good);box-shadow:0 0 0 2px var(--good) inset}
.flash.bad{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad) inset}
.swipehint{position:absolute;top:14px;font-family:var(--font-mono);font-weight:600;font-size:.78rem;opacity:0;padding:3px 8px;border-radius:6px}
.swipehint.l{left:14px;color:var(--bad);background:var(--bad-soft)} .swipehint.r{right:14px;color:var(--good);background:var(--good-soft)}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge3{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.ui .no{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.ui .yes{background:var(--good-soft);border-color:transparent;color:var(--good)}
.judge3 .idk{padding-inline:14px;color:var(--muted)}
.fb{border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:.95rem}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{font-family:var(--font-head)}
.voice{font-size:.88rem;color:var(--muted);font-style:italic}
.src{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
.boxes{display:flex;gap:4px;align-items:end}
.boxes span{display:block;width:10px;border-radius:3px;background:var(--accent)}
.combo{font-family:var(--font-mono);font-weight:600;color:var(--flame)}
.stem{font-family:var(--font-head);font-size:1.12rem;font-weight:600}
.stmt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.stmt:first-of-type{border-top:0}
.stmt .l{font-family:var(--font-mono);font-weight:600;color:var(--muted);padding-top:2px}
.tf{display:flex;gap:4px}
.tf button{width:40px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700}
.tf button[aria-pressed="true"].t{background:var(--good);border-color:var(--good);color:var(--surface)}
.tf button[aria-pressed="true"].f{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.stmt .why{grid-column:2 / 4;font-size:.9rem;border-radius:10px;padding:8px 10px}
.stmt .why.good{background:var(--good-soft)} .stmt .why.bad{background:var(--bad-soft)}
.opts{display:grid;gap:4px;font-size:.92rem}
.opts .opt{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:6px;padding:6px 10px;border-radius:10px;border:1px solid transparent}
.opts .opt .l{font-family:var(--font-mono);font-weight:600;color:var(--muted)}
.opts .opt.correct{border-color:var(--good);background:var(--good-soft)}
.opts .opt.mine{border-color:var(--bad);background:var(--bad-soft)}
.opts .opt.mine.correct{border-color:var(--good);background:var(--good-soft)}
.result{border-radius:12px;padding:12px 14px;font-weight:600}
.result.good{background:var(--good-soft);color:var(--good)} .result.bad{background:var(--bad-soft);color:var(--bad)}
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.sheet{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px;display:grid;gap:8px}
.sheet textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);resize:vertical}
.answer{white-space:pre-wrap;font-size:.95rem;background:var(--surface);border-radius:10px;padding:10px 12px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;cursor:pointer}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.exambar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:5;background:var(--bg);padding-block:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.timer{font-family:var(--font-mono);font-weight:600;font-size:1.25rem}
.timer.low{color:var(--bad)}
.radio{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:6px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.radio .l{font-family:var(--font-mono);font-weight:600;color:var(--muted)}
.radio[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--accent-soft)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.qgrid button{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-mono);font-size:.85rem;cursor:pointer}
.qgrid button.done{background:var(--accent-soft);border-color:var(--accent)}
.qgrid button.cur{box-shadow:0 0 0 2px var(--accent) inset}
.big{font-family:var(--font-head);font-size:3rem;font-weight:700;line-height:1}
.kaprow{display:grid;grid-template-columns:minmax(0,1fr) 5.5em;gap:4px 10px;align-items:center;font-size:.88rem}
details.rev{border-top:1px solid var(--line);padding-block:8px}
details.rev summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline}
details.rev summary::-webkit-details-marker{display:none}
.mlist{display:grid;gap:8px}
.mitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.mitem small{display:block;color:var(--muted)}
.okdot{font-family:var(--font-mono);font-size:.8rem;color:var(--good);font-weight:600}
.tray{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:12px;background:var(--surface-2);min-height:56px}
.piece{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;font-size:.92rem;cursor:pointer;text-align:left;max-width:100%}
.piece[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--accent-soft)}
.slot{min-height:48px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--surface)}
.slot.armed{border-color:var(--accent)}
.slot .n{font-family:var(--font-mono);font-weight:600;color:var(--muted);min-width:1.6em;text-align:center}
.slot .piece{flex:1}
.slot.ok{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.slot.no{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.mx{display:grid;gap:6px}
.mx .h{font-size:.78rem;color:var(--muted);font-weight:600;text-align:center;align-self:end}
.mx .rh{font-size:.78rem;color:var(--muted);font-weight:600;display:flex;align-items:center}
.mx .slot{min-height:72px;flex-direction:column;justify-content:center}
.bucket{border:2px dashed var(--line);border-radius:12px;padding:10px;background:var(--surface);display:grid;gap:6px;cursor:pointer;align-content:start;min-width:0}
.bucket.armed{border-color:var(--accent)}
.bucket h4{margin:0;font-family:var(--font-head);font-size:.95rem}
.bucket .piece.ok{border-color:var(--good);background:var(--good-soft)} .bucket .piece.no{border-color:var(--bad);background:var(--bad-soft)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.info{font-size:.85rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px;background:var(--surface-2);opacity:.5}
.badge.on{opacity:1;background:var(--gold-soft);border-color:var(--gold)}
.badge b{font-size:.88rem} .badge span{font-size:.75rem;color:var(--muted)}

/* ---------- Effekte ---------- */
.xpfloat{position:fixed;left:50%;top:38%;transform:translate(-50%,0);font-family:var(--font-head);font-weight:700;font-size:1.6rem;color:var(--gold);pointer-events:none;z-index:60;animation:fl 900ms ease-out forwards}
@keyframes fl{from{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}to{opacity:0;transform:translate(-50%,-40px)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:65}

/* ---------- Spiel-Bühne ---------- */
.stage{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.stage[hidden]{display:none}
.stage .sh{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 12px 8px 16px;border-bottom:1px solid var(--line)}
.stage .sh b{font-family:var(--font-head);font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .sh .mp{font-family:var(--font-mono);font-size:.75rem;color:var(--muted)}
.stage .x{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem}
.stage .sound{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.stage .body{position:relative;overflow:auto;-webkit-overflow-scrolling:touch}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.case p{margin:.2rem 0 .7rem;line-height:1.6}
.casepeek summary{cursor:pointer;font-weight:600}
.casepeek .case{max-height:40vh;overflow:auto;margin-top:8px;padding-right:4px}
.fans{width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);resize:vertical;line-height:1.5;font-size:16px}
.ftabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.ftabs::-webkit-scrollbar{display:none}
.ftabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.ftabs button.done{border-color:var(--good)}
.ftabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.kmp-q{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kmp-list{display:grid;gap:6px}
.kmp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface)}
.kmp b{display:block;font-size:.95rem}
.kmp span{display:block;font-size:.8rem;color:var(--muted)}
.kmp-cite{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 10px;font-family:var(--font-mono);font-size:.72rem;cursor:pointer;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.ck input{margin-top:4px;width:18px;height:18px;flex:0 0 auto}
.muster p{margin:.2rem 0 .6rem}
.kpnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:-4px}
.kpnav::-webkit-scrollbar{display:none}
.kpnav button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.84rem;cursor:pointer;white-space:nowrap}
.kpsec{margin-top:26px;scroll-margin-top:64px}
#kp-pod{scroll-margin-top:64px}
.podk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.podk .pp.big{width:50px;height:50px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center}
.podk .pp svg{width:24px;height:24px;fill:currentColor}
.pk-t b{display:block;font-family:var(--font-head);font-size:1.02rem}
.pk-t small{color:var(--muted);font-size:.8rem}
.pk-m summary{cursor:pointer;font-weight:600;font-size:.92rem}
.pk-m .marks{margin-top:8px}
.mitem.final{border-color:var(--gold);background:var(--amber-bg)}
.kpq .stem{font-weight:600}

/* ================= Apple-Schicht (HIG): überschreibt die Grundformen oben ================= */
body{font-size:17px;line-height:1.41;letter-spacing:-.022em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
a{color:var(--accent-text);text-decoration:none}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
/* Navigationsleiste */
.bar{background:var(--bar-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.bar .in{padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));min-height:44px;gap:6px}
.bar .back{width:auto;height:44px;padding:0 6px 0 2px;color:var(--accent);display:flex;align-items:center;gap:2px;font-size:17px}
.bar .back svg{width:24px;height:24px;stroke-width:2.6}
.bar .ttl{grid-column:2;font-family:var(--font-body);font-size:17px;font-weight:600;letter-spacing:-.022em;text-align:center}
.bar .back{grid-column:1}.bar .lvlchip{grid-column:3;justify-self:end}
.bar .ttl small{font-family:var(--font-body);font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--text-secondary)}
.lvlchip{border:0;background:var(--fill);font-family:var(--font-round);font-size:13px;font-weight:600;padding:4px 10px 4px 5px;font-variant-numeric:tabular-nums}
main#view{padding-block:12px 160px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* Typo-Skala (iOS): Large Title 34, Title 1 28, Title 2 22, Title 3 20, Headline/Body 17, Callout 16, Subhead 15, Footnote 13, Caption 12 */
.ui{gap:20px}
.ui h1,.ui h2,.ui h3{font-family:var(--font-head);font-weight:700;letter-spacing:.011em}
.ui h1{font-size:34px;line-height:41px}
.ui h2{font-size:22px;line-height:28px;letter-spacing:.016em;margin-top:8px}
.ui h3{font-size:20px;line-height:25px;font-weight:600;letter-spacing:.019em}
.ui .small{font-size:15px;line-height:20px;letter-spacing:-.016em}
.ui .muted{color:var(--text-secondary)}
.ui .mono{font-family:var(--font-round);font-variant-numeric:tabular-nums;letter-spacing:0}
.ui .eyebrow,.khead .k{font-family:var(--font-body);font-size:13px;line-height:18px;letter-spacing:-.006em;text-transform:uppercase;font-weight:400;color:var(--text-secondary)}
.khead{gap:2px}
.khead h1{font-size:34px;line-height:41px}
/* Gruppen-Karten */
.ui .card{border:0;border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.ui .stack{gap:12px}
/* Knöpfe: gefüllt (prominent), grau getönt, Kapsel */
.ui .btn{min-height:50px;border:0;border-radius:12px;padding:14px 20px;font-size:17px;font-weight:600;letter-spacing:-.022em;background:var(--fill);color:var(--accent);transition:opacity .15s,transform .1s}
.ui .btn:active{opacity:.6;transform:scale(.99)}
.ui .btn.primary{background:var(--accent);color:var(--accent-ink)}
.ui .btn.small{min-height:34px;padding:7px 14px;font-size:15px;border-radius:999px}
.ui .linkbtn{font-size:15px;font-weight:400;color:var(--accent)}
.ui .linkbtn.mutedlink{color:var(--text-secondary)}
.ui .tag{font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;padding:3px 9px;border-radius:999px}
.ui .bar8,.subj .prog{height:6px;border-radius:999px;background:var(--fill)}
.ui .bar8 span{border-radius:999px}
/* Startseite */
.hero{gap:2px;padding-top:4px}
.hero .hi{font-family:var(--font-head);font-size:34px;line-height:41px;font-weight:700;letter-spacing:.011em}
.today{gap:12px}
.today .t{border:0;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.today .t b{font-family:var(--font-round);font-size:28px;line-height:34px;font-weight:700;font-variant-numeric:tabular-nums}
.today .t span{font-size:13px;color:var(--text-secondary)}
.subjects{gap:12px}
.subj{border:0;border-radius:16px;padding:16px;gap:4px;box-shadow:var(--shadow)}
.subj::before{inset:16px auto auto 16px;width:10px;height:10px;border-radius:50%}
.subj .meta{font-family:var(--font-body);font-size:13px;letter-spacing:-.006em;padding-left:18px}
.subj .meta + .nm + .meta{padding-left:0}
.subj .nm{font-family:var(--font-head);font-size:20px;line-height:25px;font-weight:600;letter-spacing:.019em}
.subj .cd{font-family:var(--font-round);right:16px;top:14px}
.subj .cd b{font-size:22px;font-weight:700}
.subj .cd small{font-family:var(--font-body);font-size:11px;letter-spacing:.02em}
.subj.soon{background:var(--surface);border:0;opacity:.6;box-shadow:none}
/* Kapitel-Chips und Abschnitts-Sprünge: Kapseln */
.chips{gap:8px;padding:0 0 4px}
.chip,.kpnav button,.ftabs button{border:0;background:var(--fill);color:var(--text-primary);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:500;letter-spacing:-.016em}
.chip[aria-pressed="true"],.ftabs button[aria-selected="true"]{background:var(--text-primary);color:var(--bg);font-weight:600}
.chip .dot{background:var(--tertiary)}
.kpnav{gap:8px;margin-top:0}
/* Segmented Control */
.seg{background:var(--fill);border-radius:9px;padding:2px;gap:0}
.seg button{border-radius:7px;padding:6px 4px;font-size:13px;font-weight:500;color:var(--text-primary)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text-primary);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
/* Kacheln */
.tiles{gap:12px}
.tile{border:0;border-radius:14px;padding:16px;gap:4px;box-shadow:var(--shadow)}
.tile b{font-family:var(--font-head);font-size:17px;line-height:22px;font-weight:600}
.tile span{font-size:15px;line-height:20px;color:var(--text-secondary)}
.tile .eyebrow{font-size:12px}
/* Gruppierte Liste wie in den Einstellungen */
.mlist{gap:0;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.mitem{position:relative;grid-template-columns:minmax(0,1fr) auto 10px;gap:10px;border:0;border-radius:0;background:transparent;padding:11px 16px;min-height:44px;font-size:17px;line-height:22px}
.mitem::after{content:"";width:8px;height:8px;border-top:2px solid var(--tertiary);border-right:2px solid var(--tertiary);transform:rotate(45deg);justify-self:end;margin-right:2px}
.mitem + .mitem::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.mitem:active{background:var(--fill)}
.mitem b{font-weight:400}
.mitem small{font-size:15px;line-height:20px;color:var(--text-secondary);margin-top:2px}
.mitem.final{border:0;background:transparent}
.mitem.final b{font-weight:600}
.okdot{font-family:var(--font-round);font-size:15px;font-weight:600;color:var(--text-secondary)}
/* Spielkarten */
.gamecard{border-radius:20px;padding:20px 18px 18px;min-height:160px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.gamecard .gk{font-family:var(--font-body);font-size:12px;letter-spacing:.02em;font-weight:600}
.gamecard b{font-family:var(--font-head);font-size:24px;line-height:29px;font-weight:700;letter-spacing:.007em}
.gamecard span{font-size:15px;line-height:20px}
.gamecard .ms{font-family:var(--font-round);font-size:12px;font-weight:600;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.gamecard.soon{background:var(--surface);border:0;opacity:.65;box-shadow:none}
/* Podcast */
.podk{gap:14px}
.podk .pp.big{width:52px;height:52px}
.pk-t b{font-family:var(--font-body);font-size:17px;font-weight:600}
.pk-t small{font-size:15px;color:var(--text-secondary)}
.pk-m summary{font-size:17px;font-weight:400;color:var(--accent);list-style:none}
.pk-m summary::-webkit-details-marker{display:none}
.marks button{font-size:15px;border-radius:10px;padding:9px 8px}
.marks button .tm{font-family:var(--font-round);font-size:15px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.mini{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-bottom:0;border:0;border-radius:16px;background:var(--bar-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.mini .in{padding:8px 12px 10px}
.mini .nm{font-size:15px}
.mini .nm small{font-family:var(--font-round);font-size:13px;color:var(--text-secondary)}
.mini .sk{font-family:var(--font-round);font-size:13px;color:var(--accent)}
.mini .prog{height:3px;background:var(--fill)}
/* Prüfungen und Antworten */
.stem{font-family:var(--font-body);font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.022em}
.radio{border:0;background:var(--fill);border-radius:12px;padding:12px 14px;font-size:16px;line-height:21px;gap:8px}
.radio .l{font-family:var(--font-round);color:var(--text-secondary)}
.radio[aria-checked="true"]{background:var(--accent-bg);box-shadow:0 0 0 2px var(--accent) inset}
.radio[aria-checked="true"] .l{color:var(--accent)}
.fb{border-radius:12px;font-size:15px;line-height:20px}
.fb b{font-family:var(--font-body)}
.big{font-family:var(--font-round);font-size:56px;font-weight:700;letter-spacing:-.01em}
.timer{font-family:var(--font-round);font-variant-numeric:tabular-nums}
.exambar{top:calc(env(safe-area-inset-top,0px) + 56px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
details.rev{border-top:0}
.ui details.card.rev{padding:14px 16px}
.voice{font-size:15px;color:var(--text-secondary)}
.kmp-q,.fans,.sheet textarea{border:0;background:var(--fill);border-radius:10px;font-size:17px}
.kmp-q{padding:8px 12px;min-height:36px}
.kmp{border:0;border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.kmp-cite{border:0;background:var(--fill);color:var(--accent);font-family:var(--font-body);font-size:13px;font-weight:600}
.sheet{border:0;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.pick button{border:0;background:var(--fill);font-size:15px}
.badge{border:0;border-radius:12px;background:var(--surface)}
.badge.on{background:var(--amber-bg)}
/* Hinweise und Spielbühne */
.toast{background:rgba(30,30,32,.9);color:#FFFFFF;border-radius:14px;font-size:15px;font-weight:600;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.xpfloat{font-family:var(--font-round)}
.stage .sh{min-height:52px;border-bottom:.5px solid var(--sep);background:var(--bar-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.stage .sh b{font-family:var(--font-body);font-size:17px;font-weight:600}
.stage .sh .mp{font-family:var(--font-round);font-size:13px;color:var(--text-secondary)}
.stage .x,.stage .sound{width:32px;height:32px;border:0;border-radius:50%;background:var(--fill);color:var(--text-secondary);font-size:15px;font-weight:700}
.kpsec{margin-top:32px}
/* Lernseiten im App-Look */
.ls{font-size:17px;line-height:1.5}
#pane{min-width:0}
.ls{overflow-wrap:break-word;min-width:0}
.ls *, .ls{box-sizing:border-box}
.ls{margin:0;background:var(--bg);color:var(--text-primary);font-family:var(--font-body);font-size:16px;line-height:1.7;padding:0 20px}
.ls a{color:var(--accent-text)}
.ls .wrap{max-width:700px;margin:0 auto;padding-block:2.5rem 4rem}
.ls h1, .ls h2, .ls h3{font-family:var(--font-head);font-weight:600;text-wrap:balance;margin:0}
.ls h1{font-size:2rem;line-height:1.15}
.ls h2{font-size:1.4rem;margin-bottom:.6rem}
.ls h3{font-size:1.1rem;margin:1.4rem 0 .4rem}
.ls p{margin:0 0 1rem}
.ls .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:.5rem}
.ls .meta{color:var(--text-secondary);font-size:14px;margin-top:.4rem}
.ls .chapters{display:flex;gap:6px;overflow-x:auto;padding:1rem 0 1.5rem;border-bottom:1px solid var(--border);margin-bottom:2rem}
.ls .chip{flex:0 0 auto;font-family:var(--font-mono);font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-muted);white-space:nowrap}
.ls .chip.active{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.ls section{margin-bottom:2.6rem}
.ls .lead{font-size:18px;color:var(--text-secondary)}
.ls .act{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);margin-bottom:.3rem}
.ls .callout{background:var(--accent-bg);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin:1rem 0}
.ls .callout .label, .ls .principle .label, .ls .check .label, .ls .exam .label{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem}
.ls .callout .label{color:var(--accent-text)}
.ls .callout p:last-child, .ls .principle p:last-child, .ls .exam p:last-child{margin-bottom:0}
.ls .source{background:var(--surface-2);border:1px dashed var(--border);border-radius:12px;padding:.85rem 1.1rem;font-size:14px;color:var(--text-secondary);margin:1rem 0 0}
.ls .source p{margin:0}
.ls .exam{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin:1.2rem 0 0}
.ls .exam .label{color:var(--coral)}
.ls .exam ul{margin:.2rem 0 0;padding-left:1.1rem;font-size:15px}
.ls .exam li{margin-bottom:.2rem}
.ls .formula{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin:1rem 0;text-align:center;font-family:var(--font-mono);font-size:15px}
.ls .principle{background:var(--amber-bg);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin:1.2rem 0}
.ls .principle .label{color:var(--amber)}
.ls .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin:1rem 0}

function kombiText(k, q){ if(k === 'alle') return (q && q.alle) || (q && q.neg ? 'alle Aussagen sind falsch' : 'alle Aussagen sind richtig'); if(k === 'keine') return (q && q.keine) || 'alle Aussagen sind falsch'; const p = k.map(x => x + ')'); return p.length > 1 ? p.slice(0,-1).join(', ') + ' & ' + p[p.length-1] : p[0]; }
const stmts = q => ['a','b','c','d'].filter(l => q[l]);
/* Originalformat: Aussagen a–d (manchmal nur a–c), danach Kombinationen; neg = „Welche Aussage ist falsch?“ → gesucht ist die Menge der falschen Aussagen */
function options(q){ const st = stmts(q); const L = 'abcdefgh'; const o = st.map(l => ({l, text:q[l].t, set:[l]})); q.kombis.forEach((k,i) => o.push({l:L[st.length + i], text:kombiText(k, q), set: k === 'alle' ? st.slice() : k === 'keine' ? [] : k.slice().sort()})); return o; }
const setKey = arr => arr.slice().sort().join('');
function correctOpt(q){ const r = setKey(stmts(q).filter(l => q.neg ? !q[l].r : q[l].r)); const o = options(q).find(o => setKey(o.set) === r); return o ? o.l : '?'; }
function optForSet(q, arr){ const r = setKey(arr); const o = options(q).find(o => setKey(o.set) === r); return o ? o.l : null; }
function sentence(q, l){ return '<span class="st">' + esc(q.stamm.replace(/\s*…\s*$/, '')) + '</span> <span class="co">' + esc(q[l].t.replace(/^…\s*/, '')) + '</span>'; }

function judge(F, id, ok){ const f = FS(F.id); const s = f.st[id] || {b:0, n:0, r:0, t:0}; const wasWrong = s.n > 0 && s.b === 0; s.n++; if(ok){ s.r++; s.b = Math.min(5, s.b+1); if(wasWrong) S.fixed++; } else s.b = 0; s.t = Date.now(); f.st[id] = s; touchDay(); S.day.n++; save(); }

/* ---------- Blitz ---------- */
let BZ = {cur:null, done:false, streak:0, count:0, fb0:0, recent:[]};
function stmtPool(F, kap){ const out = []; F.Q.forEach(q => { if(!kap || q.kap === kap) ['a','b','c','d'].filter(l => q[l]).forEach(l => out.push({q, l, id:q.id+'|'+l})); }); return out; }
function nextStmt(F, kap){
  const f = FS(F.id); const pool = stmtPool(F, kap); if(!pool.length) return null; const now = Date.now();
  const sc = pool.filter(p => !BZ.recent.includes(p.id)).map(p => { const s = f.st[p.id]; let pr; if(!s) pr = 2 + Math.random(); else if(s.b === 0) pr = 3 + Math.random(); else if(now - s.t > IV[s.b]) pr = 1 + Math.random() - s.b*0.1; else pr = Math.random()*0.5 - s.b*0.1; return {p, pr}; }).sort((a,b) => b.pr - a.pr);
  const pick = (sc[0] || {p:pool[0]}).p; BZ.recent.push(pick.id); if(BZ.recent.length > Math.min(8, pool.length-1)) BZ.recent.shift(); return pick;
}
function boxesHTML(s){ const b = s ? s.b : -1; let h = '<span class="boxes" title="Lernstand dieser Aussage">'; for(let i=0;i<5;i++) h += '<span style="height:' + (6+i*3) + 'px;opacity:' + (i < b ? 1 : .18) + '"></span>'; return h + '</span>'; }

/* ---------- Klausurfragen ---------- */

/* ---------- Baukasten ---------- */
let BK = null;
function openModel(F, m, pane){ let pieces;

/* ================= Endgegner ================= */
let tick = null, qT0 = 0;
function buildExam(F){ const K = F.klausur; const need = K.mix; const ids = [];

    while(got < need[p] && guard++ < 500 && kaps.length){ const k = kaps[i++ % kaps.length]; const q = byKap[k].shift(); if(q){ ids.push(q.id); got++; } } });
  FS(F.id).exam = {ids:shuffle(ids), ans:{}, start:Date.now(), cur:0, done:false, zeit:{}, wechsel:{}}; save(); track('klausur_start', {n:ids.length}); }

    $('#estart').onclick = () => { buildExam(F); renderKlausur(F); }; return; }

    '<div class="judge"><button type="button" class="btn" id="eprev" ' + (E.cur === 0 ? 'disabled' : '') + '>← Zurück</button><button type="button" class="btn primary" id="enext">' + (E.cur === E.ids.length-1 ? 'Zur Übersicht' : 'Weiter →') + '</button></div></article>' +
    '<article class="card stack"><div class="qgrid">' + E.ids.map((id,i) => '<button type="button" data-i="' + i + '" class="' + (E.ans[id] ? 'done' : '') + (i === E.cur ? ' cur' : '') + '">' + (i+1) + '</button>').join('') + '</div><div id="sub"><button type="button" class="btn wide" id="esub">Abgeben</button></div></article></div>';

  if(t.all) h += '<div class="row" style="align-items:baseline"><span class="big" style="color:var(--' + (pass ? 'good' : 'bad') + ')">' + (Math.round(t.p*2)/2) + '</span><span class="mono muted">/ ' + K.punkte + ' Punkte · Note ' + note + '</span></div><p><b>' + (pass ? 'Positiv.' : 'Noch nicht positiv. Dir fehlen ' + (K.positiv - t.p) + ' Punkte.') + '</b></p><p class="voice">' + esc(pass ? (note <= 2 ? 'Prof: Sehr stark. So schaut eine Einser-Antwort aus.' : 'Lena: Bestanden. Schau dir unten an, wo noch Punkte liegen geblieben sind.') : 'Prof: Kein Drama. Lesen Sie, was gefehlt hat, und probieren Sie den nächsten Fall.') + '</p>';

  else h += '<p><b>Wird korrigiert …</b> ' + (E.gradeErr ? 'Das hat gerade nicht geklappt. <button type="button" class="linkbtn" id="fretry">Nochmal versuchen</button> oder <button type="button" class="linkbtn" id="fself">selbst korrigieren</button>' : 'Der Prüfer-Bot liest deine Antworten. Das dauert pro Frage etwa eine halbe Minute.') + '</p>';
  h += '<button type="button" class="btn primary wide" id="fagain">Neuer Fall</button></article>';
  fall.fragen.forEach(fr => { const k = String(fr.nr); const g = E.grades[k]; const a = E.ans[k] || '';
    h += '<article class="card stack"><div class="spread"><b>Frage ' + fr.nr + '</b><span class="mono">' + (g ? (Math.round(g.punkte*2)/2) + ' / ' + fr.punkte : '… / ' + fr.punkte) + '</span></div><p class="small">' + esc(fr.text) + '</p>';
    if(g){ h += '<div class="bar8"><span style="width:' + (100*g.punkte/fr.punkte) + '%;background:var(--' + (g.punkte/fr.punkte >= .5 ? 'good' : 'bad') + ')"></span></div>' +
      (g.staerken ? '<div class="fb good"><span><b>Gut:</b> ' + esc(g.staerken) + '</span></div>' : '') + (g.fehlt ? '<div class="fb bad"><span><b>Für volle Punkte fehlt:</b> ' + esc(g.fehlt) + '</span></div>' : '') + (g.tipp ? '<p class="voice">Tipp: ' + esc(g.tipp) + '</p>' : '') +
      '<details><summary class="small">Erwartungshorizont</summary><div class="stack" style="gap:4px;padding-top:6px">' + fr.kriterien.map(c => { const got = (g.kriterien.find(x => x.id === c.id) || {}).punkte; return '<div class="spread small"><span>' + esc(c.t) + '</span><span class="mono">' + (got != null ? got + '/' : '') + c.p + '</span></div>'; }).join('') + '</div></details>'; }
    else if(E.selbst){ h += '<a class="btn small" style="justify-self:start" target="_blank" rel="noopener" href="' + esc(claudeLink(gradePrompt(F, fall, fr, a))) + '">🤖 Von Claude korrigieren lassen</a><div class="stack selfcheck" data-nr="' + k + '" style="gap:6px">' + fr.kriterien.map(c => '<label class="ck"><input type="checkbox" data-id="' + esc(c.id) + '" data-p="' + c.p + '"> <span>' + esc(c.t) + ' <span class="mono muted">(' + c.p + ' P)</span></span></label>').join('') + '<button type="button" class="btn small" data-selfok="' + k + '" style="justify-self:start">Punkte übernehmen</button></div>'; }
    else h += '<p class="muted small" id="gst' + k + '">wartet auf Korrektur</p>';
    h += '<details><summary class="small">Deine Antwort (' + words(a) + ' Wörter)</summary><div class="small" style="white-space:pre-wrap;padding-top:6px">' + esc(a || '–') + '</div></details>' +
      '<details' + (g || E.selbst ? ' open' : '') + '><summary class="small">Musterlösung</summary><div class="small muster" style="padding-top:6px">' + paras(fr.muster) + (fr.zitate && fr.zitate.length ? '<p class="mono muted">Quellen: ' + esc(fr.zitate.join(' · ')) + '</p>' : '') + '</div></details></article>'; });
  v.innerHTML = h + '<article class="card stack case"><details><summary>Fall: ' + esc(fall.titel) + '</summary>' + paras(fall.text) + '</details></article></div>';
  bindMood(() => { E.mood = true; save(); const m = $('#mood'); if(m) m.remove(); });
  $('#fagain').onclick = () => { if(!fallTotal(F).all && !confirmAgain) { confirmAgain = true; toast('Noch nicht fertig korrigiert. Nochmal tippen, um trotzdem neu zu starten.'); return; } confirmAgain = false; f.fall = null; save(); renderFallKlausur(F); };
  const rt = $('#fretry'); if(rt) rt.onclick = () => { E.gradeErr = null; save(); renderFallResult(F); gradeAll(F); };
  const sf = $('#fself'); if(sf) sf.onclick = () => { E.selbst = true; E.gradeErr = null; save(); renderFallResult(F); };
  v.querySelectorAll('[data-selfok]').forEach(b => b.onclick = () => { const k = b.dataset.selfok; const box = v.querySelector('.selfcheck[data-nr="' + k + '"]'); const kr = [...box.querySelectorAll('input')].map(i => ({id:i.dataset.id, punkte:i.checked ? +i.dataset.p : 0})); const fr = fall.fragen.find(q => String(q.nr) === k);
    E.grades[k] = {punkte:kr.reduce((a, x) => a + x.punkte, 0), max:fr.punkte, kriterien:kr, staerken:'', fehlt:'', tipp:'', via:'selbst'}; save(); track('fall_note', {id:E.id, nr:fr.nr, p:E.grades[k].punkte, via:'selbst'}); renderFallResult(F); });
  if(!t.all && !E.selbst && !E.gradeErr && !grading) gradeAll(F);
}
let confirmAgain = false;

/* ---------- Fallfragen üben (kurze Fälle je Kapitel) ---------- */
function renderFallUeben(F, kap, box){
  const items = (F.uebungen || []).filter(u => u.kap === kap.k); const f = FS(F.id); f.ueb = f.ueb || {};
  if(!items.length){ box.innerHTML = '<p class="muted">Für dieses Kapitel kommen die Fallfragen bald.</p>'; return; }
  const i = Math.min(items.length - 1, Math.max(0, (f.uebIdx && f.uebIdx[kap.k]) || 0)); const u = items[i]; const st = f.ueb[u.id] || {};
  box.innerHTML = '<article class="card stack"><div class="spread"><span class="eyebrow">Fallfrage ' + (i+1) + ' von ' + items.length + '</span><span class="mono small">' + (st.g ? st.g.punkte + '/' + u.punkte + ' P' : u.punkte + ' P') + '</span></div><h3>' + esc(u.titel) + '</h3>' + paras(u.situation) + '<p class="stem">' + esc(u.frage) + '</p>' +
    '<textarea class="fans" id="uans" aria-label="Deine Antwort" placeholder="Begriff + Zitat → Anwendung auf den Fall → Begründung">' + esc(st.a || '') + '</textarea><div class="spread small muted"><span id="uwc">' + words(st.a) + ' Wörter</span><span>' + (sample ? 'KI-Korrektur' : 'Selbstcheck') + '</span></div>' +
    '<div class="row"><button type="button" class="btn primary" id="ucheck2">' + (sample ? 'Korrigieren lassen' : 'Mit Lösung vergleichen') + '</button>' + (F.kompass ? '<button type="button" class="btn" id="ukmp">📖 Kompass</button>' : '') + '</div><div id="ukbox"></div><div id="ures"></div>' +
    '<div class="judge"><button type="button" class="btn" id="uprev" ' + (i === 0 ? 'disabled' : '') + '>← Vorige</button><button type="button" class="btn" id="unext" ' + (i === items.length-1 ? 'disabled' : '') + '>Nächste →</button></div></article>';
  const t0 = visNow(); const ta = $('#uans', box);
  ta.oninput = () => { st.a = ta.value; f.ueb[u.id] = st; $('#uwc', box).textContent = words(ta.value) + ' Wörter'; clearTimeout(fallSaveT); fallSaveT = setTimeout(save, 600); };
  const move = d => { f.uebIdx = f.uebIdx || {}; f.uebIdx[kap.k] = i + d; save(); renderFallUeben(F, kap, box); };
  $('#uprev', box).onclick = () => move(-1); $('#unext', box).onclick = () => move(1);
  const km = $('#ukmp', box); if(km) km.onclick = () => { const kb = $('#ukbox', box); if(kb.innerHTML){ kb.innerHTML = ''; return; } kb.innerHTML = kompassHTML(F, 'ukq'); bindKompass(F, kb, 'ukq'); };
  const showRes = () => { const g = st.g; const r = $('#ures', box);
    r.innerHTML = (g ? '<div class="stack" style="gap:6px;margin-top:8px"><div class="bar8"><span style="width:' + (100*g.punkte/u.punkte) + '%;background:var(--' + (g.punkte/u.punkte >= .5 ? 'good' : 'bad') + ')"></span></div>' + (g.staerken ? '<div class="fb good"><span><b>Gut:</b> ' + esc(g.staerken) + '</span></div>' : '') + (g.fehlt ? '<div class="fb bad"><span><b>Fehlt:</b> ' + esc(g.fehlt) + '</span></div>' : '') + (g.tipp ? '<p class="voice">Tipp: ' + esc(g.tipp) + '</p>' : '') + '</div>' : '') +
      '<details open><summary class="small">Musterlösung und Erwartungshorizont</summary><div class="small muster" style="padding-top:6px">' + paras(u.muster) + '<div class="stack" style="gap:4px">' + u.kriterien.map(c => '<div class="spread"><span>' + esc(c.t) + '</span><span class="mono">' + c.p + ' P</span></div>').join('') + '</div></div></details>'; };
  if(st.g || st.gezeigt) showRes();
  $('#ucheck2', box).onclick = async () => { const a = ta.value; track('fallfrage', {id:u.id, woerter:words(a), ms:Math.round(visNow() - t0)});
    if(!sample || words(a) < 5){ st.gezeigt = true; f.ueb[u.id] = st; save(); showRes(); if(!sample && words(a) >= 5){ const r = $('#ures', box); r.insertAdjacentHTML('afterbegin', '<a class="btn small" target="_blank" rel="noopener" href="' + esc(claudeLink(gradePrompt(F, {titel:u.titel, text:u.situation}, {nr:1, text:u.frage, punkte:u.punkte, kriterien:u.kriterien, muster:u.muster}, a))) + '">🤖 Von Claude korrigieren lassen</a>'); } return; }
    const b = $('#ucheck2', box); b.disabled = true; $('#ures', box).innerHTML = '<p class="muted small">Der Prüfer liest …</p>';
    try{ const fake = {titel:u.titel, text:u.situation}; const g = await gradeOne(F, fake, {nr:1, text:u.frage, punkte:u.punkte, kriterien:u.kriterien, muster:u.muster}, a); st.g = g; st.gezeigt = true; f.ueb[u.id] = st; save(); track('fallfrage_note', {id:u.id, p:g.punkte, max:u.punkte}); addXP(10 + Math.round(10*g.punkte/u.punkte)); ton(g.punkte/u.punkte >= .5 ? 'ok' : 'fehler'); }
    catch(e){ st.gezeigt = true; f.ueb[u.id] = st; save(); toast(e && e.code === 'not_granted' ? 'Ohne Claude-Zugriff: Vergleich mit der Musterlösung.' : 'Korrektur hat nicht geklappt, hier die Musterlösung.'); }
    finally{ b.disabled = false; showRes(); } };
}

/* ================= Stand ================= */
function renderStand(F){
  const v = $('#view'); let h = '<div class="ui">';
  if(F){ setTitle(F.name, 'Mein Stand'); const f = FS(F.id); let mast = 0; Object.values(f.st).forEach(s => { if(s.b >= 2) mast++; }); const tot = F.Q.length*4;
    h += chapterChips(F, null) + '<article class="card stack"><h2>Dein Stand in ' + esc(F.kurz) + '</h2><div class="spread"><span>Aussagen, die sitzen</span><b class="mono">' + mast + ' / ' + tot + '</b></div><div class="bar8"><span style="width:' + (100*mast/Math.max(1,tot)) + '%"></span></div>' +
      '<div class="spread"><span>Fragen zuletzt richtig</span><b class="mono">' + Object.values(f.q).filter(s => s.last).length + ' / ' + F.Q.length + '</b></div><div class="spread"><span>Baukästen gelöst</span><b class="mono">' + Object.values(f.mod).filter(x => x.ok).length + ' / ' + F.M.length + '</b></div>' +
      '<div class="spread"><span>Beste Simulation</span><b class="mono">' + (f.sims.length ? f.best + ' / ' + F.klausur.punkte : '–') + '</b></div><p class="muted small">„Sitzt“ heißt: mindestens zweimal hintereinander richtig. Ziel bis zur Klausur: alle Kapitel über 80 % und zwei Simulationen klar positiv.</p></article>' +
      '<article class="card stack"><h3>Nach Kapitel</h3>' + F.kapitel.map(k => { const r = kapMastery(F, k.k); return '<div class="kaprow"><span>Kap. ' + esc(k.nr) + ' ' + esc(k.name) + '</span><span class="mono" style="text-align:right">' + Math.round(100*r) + ' %</span><div class="bar8" style="grid-column:1/3"><span style="width:' + (100*r) + '%;background:var(--' + (r >= .8 ? 'good' : r >= .4 ? 'accent' : 'bad') + ')"></span></div></div>'; }).join('') + '</article>';
  }
  h += '<article class="card stack"><h3>Level ' + (levelOf(S.xp)+1) + ' · ' + esc(LEVELS[levelOf(S.xp)][1]) + '</h3><p class="muted small">' + S.xp + ' XP gesamt · 🔥 ' + streakDays() + ' Tage in Folge · heute ' + (S.day.d === today() ? S.day.xp : 0) + ' von ' + GOAL + ' XP</p></article>' +
    '<article class="card stack"><h3>Abzeichen</h3><div class="badges">' + BADGES.map(b => '<div class="badge' + (S.badges[b.id] ? ' on' : '') + '"><b>' + (S.badges[b.id] ? '★ ' : '') + esc(b.n) + '</b><span>' + esc(b.d) + '</span></div>').join('') + '</div></article>' +
    '<article class="card stack"><h3>Was ich über dein Lernen weiß</h3>' + insightsHTML() + '</article>' +
    '<article class="card stack"><h3>Wunsch oder Idee?</h3><p class="muted small">Was soll ich an der App besser machen? Ich lese das bei der nächsten Auswertung.</p><textarea id="wish" style="width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)" aria-label="Wunsch"></textarea><button type="button" class="btn small" id="wishsend" style="justify-self:start">Senden</button><div id="wishout"></div></article>' +
    (ENC ? '<article class="card stack"><h3>Lernstand an Claude schicken</h3><p class="muted small">Damit ich auswerten kann, wo du hängst und was gut funktioniert. Der Lernstand ist verschlüsselt, nur ich kann ihn mit deinem Schlüssel lesen.' + (S.sent ? ' Zuletzt geschickt: ' + esc(S.sent) + '.' : '') + '</p><button type="button" class="btn primary" id="lsCopy">Lernstand kopieren</button><p class="muted small" id="lsOut">Danach einfach im Chat mit Claude einfügen und senden.</p></article>' : '') +
    '<article class="card stack"><h3>Daten</h3><p class="muted small">' + (db && !dbOff ? 'Tracking ist aktiv: Wie lange du für Antworten brauchst, wo du hängst, was du fragst, welche Spiele du spielst. Das wertet dein Lernassistent aus und verbessert damit die Inhalte. Dein Fortschritt ist auf allen Geräten gleich.' : 'Tracking ist in dieser Ansicht nicht verfügbar. Dein Fortschritt bleibt auf diesem Gerät.') + '</p><div id="rs"><button type="button" class="btn small" id="reset">Fortschritt löschen</button></div></article></div>';
  v.innerHTML = h; if(F) bindChapterChips(F);
  const lc = $('#lsCopy'); if(lc) lc.onclick = async () => { const out = $('#lsOut');
    try{ flushLocal(); const code = await lernstandCode(); let ok = false; try{ await navigator.clipboard.writeText(code); ok = true; }catch(e){}
      if(ok){ S.sent = new Date().toLocaleDateString('de-AT'); save(); out.textContent = 'Kopiert (' + Math.round(code.length/1024) + ' KB). Jetzt im Chat mit Claude einfügen und senden.'; track('lernstand_kopiert', {kb:Math.round(code.length/1024)}); }
      else { out.innerHTML = '<textarea class="fans" style="min-height:120px" readonly>' + esc(code) + '</textarea><span>Kopieren ging nicht automatisch: Text oben antippen, alles auswählen, kopieren.</span>'; } }
    catch(e){ out.textContent = 'Das hat nicht geklappt: ' + (e && e.message || e); } };
  $('#wishsend').onclick = async () => { const t = $('#wish').value.trim(); if(!t) return; track('wunsch', {text:t.slice(0,600)}); if(db && !dbOff){ try{ await db.collection('meldungen').add({zeit:new Date().toISOString(), art:'wunsch', text:t.slice(0,1000), sitzung:T.sid, version:VERSION}); }catch(e){} } $('#wish').value = ''; $('#wishout').innerHTML = '<p class="small muted">Danke, ist angekommen.</p>'; flush(); };
  $('#reset').onclick = () => { $('#rs').innerHTML = '<div class="judge"><button type="button" class="btn" id="rno">Abbrechen</button><button type="button" class="btn primary" id="ryes">Ja, alles löschen</button></div>'; $('#rno').onclick = () => route(); $('#ryes').onclick = () => { track('reset', {}); S = fresh(); save(); route(); }; };
}

/* ================= Start ================= */
async function boot(){
  if(!ENC){ newDay(); renderTop(); route(); return; }
  rawHash(); let k = HKEY; try{ if(k) localStorage.setItem('lernapp-key', k); else k = HKEY = localStorage.getItem('lernapp-key') || ''; }catch(e){}
  const lock = msg => { $('#view').innerHTML = '<div class="ui"><div class="card stack"><h2>🔒 Deine Lern-App</h2><p>' + esc(msg) + '</p><input id="keyin" class="kmp-q" placeholder="Persönlichen Link oder Schlüssel einfügen" aria-label="Link oder Schlüssel"><button type="button" class="btn primary" id="keygo">Öffnen</button></div></div>';
    $('#keygo').onclick = () => { const v = $('#keyin').value.trim(); const m = v.match(/#([A-Za-z0-9_-]{30,})~/) || v.match(/^([A-Za-z0-9_-]{30,})$/); if(!m){ toast('Das ist kein gültiger Link.'); return; } HKEY = m[1]; try{ localStorage.setItem('lernapp-key', HKEY); }catch(e){} location.hash = HKEY + '~'; location.reload(); }; };
  if(!k){ lock('Die Inhalte sind verschlüsselt. Öffne die App über deinen persönlichen Link oder füge ihn hier ein.'); return; }
  try{ CK = await crypto.subtle.importKey('raw', b64u(k), 'AES-GCM', false, ['decrypt', 'encrypt']); const cfg = JSON.parse(await getText('d/faecher.json')); FAECHER = cfg.faecher; NAME = cfg.name || ''; }
  catch(e){ console.warn(e); lock('Der Schlüssel passt nicht oder die Inhalte konnten nicht geladen werden. Prüf die Internetverbindung oder öffne deinen persönlichen Link erneut.'); return; }
  if(!location.hash.includes('~')) history.replaceState(null, '', '#' + HKEY + '~' + location.hash.replace(/^#/, ''));
  newDay(); renderTop(); route();
}
boot();
</script>
